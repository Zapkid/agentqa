# VeroniQA (agentqa/veroniqa/app.py). Local use: bind to loopback, cap uploads at the knowledge
# base's own 5 MB limit, no usage telemetry, no "Deploy" button.
[server]
address = "127.0.0.1"
maxUploadSize = 5
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Same palette as the public site (agentqa/veroniqa/site.py).
[theme]
base = "dark"
primaryColor = "#7c6dfa"
backgroundColor = "#080c1a"
secondaryBackgroundColor = "#111118"
textColor = "#e8e8f0"
borderColor = "#2a2a35"
linkColor = "#a99bff"
