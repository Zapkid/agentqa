global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: agentqa            # agent metrics via the Collector's Prometheus exporter
    static_configs: [{targets: ["otel-collector:9464"]}]
  - job_name: cadvisor           # target container CPU and memory
    static_configs: [{targets: ["cadvisor:8080"]}]
