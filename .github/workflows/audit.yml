# Weekly scan of the locked dependencies for known vulnerabilities (make audit). Kept out of the
# pull-request workflow so a new advisory does not fail unrelated PRs.
name: audit
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - run: make audit
