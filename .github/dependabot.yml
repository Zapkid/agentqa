# Weekly update PRs. Python caps live in pyproject.toml, so a major bump arrives as a reviewed PR
# that CI (including the replay gate) has to pass before it can land.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /deploy
    schedule: {interval: weekly}
