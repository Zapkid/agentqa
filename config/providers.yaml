# Per-provider limits for the token-bucket limiter and retry policy.
# API keys come from GEMINI_API_KEY, ANTHROPIC_API_KEY and OPENROUTER_API_KEY (see .env.example).
# Capabilities, for reference: Anthropic uses json_schema output and cache_control on the static
# system prefix; Gemini caches implicitly (cached_content_token_count); OpenRouter passes
# response_format through on supporting models and every output is validated anyway.
# Gemini free tier is assumed tight (Flash-class free tier ~10 RPM / 250 RPD, shared TPM; as of 2026-10-07).
providers:
  gemini:
    free_tier: true            # cost_usd_actual = 0
    rpm: 10
    tpm: 250000
    rpd: 250
    max_retries: 4
  anthropic:
    free_tier: false
    rpm: 50
    tpm: 400000
    rpd: 100000
    max_retries: 4
  openrouter:
    base_url: https://openrouter.ai/api/v1
    free_tier: true            # only :free models are used by default
    rpm: 20
    tpm: 200000
    rpd: 50                    # 1000 after $10 lifetime credit purchase
    max_retries: 4
  simulated:
    free_tier: true
    rpm: 100000
    tpm: 100000000
    rpd: 10000000
    max_retries: 0
circuit_breaker:
  failure_threshold: 3        # consecutive failures before opening
  reset_after_s: 60           # half-open after this long
backoff:
  base_s: 1.0
  max_s: 30.0
  jitter: 0.25
structured_output:
  max_repair_retries: 2
