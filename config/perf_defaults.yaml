# Used only when the requirement docs do not state an SLO. Reported as ASSUMPTIONS.
slos:
  p95_ms: 500
  p99_ms: 1200
  error_rate: 0.01
  min_rps: 20
# Load shapes as steps [duration_s, users, spawn_rate]. Short by design: CI and the A/B benchmark
# run several builds x 3 iterations on one host. Use --duration to lengthen soak runs.
shapes:
  smoke:  [[8, 2, 2]]
  load:   [[20, 20, 20]]
  stress: [[6, 5, 50], [6, 15, 50], [6, 30, 50], [6, 50, 50]]
  spike:  [[8, 5, 50], [8, 50, 100], [8, 5, 100]]
  soak:   [[60, 10, 10]]
warmup_s: 1.5            # discarded at the start of every step (ramp transitions)
iterations: 3
data_setup_orders_cap: 200000
