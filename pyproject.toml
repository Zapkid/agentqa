[project]
name = "agentqa"
version = "0.1.0"
description = "Autonomous, observable, guarded API test agent: OpenAPI spec + requirement docs in, risk-ranked tests, findings and an executive summary out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  # Floors are the versions this project is tested with (see uv.lock); caps stop a silent major
  # (or, for 0.x packages, minor) upgrade. Dependabot proposes bumps; CI installs with --locked.
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<0.29",
  "fastapi>=0.142,<0.143",
  "uvicorn>=0.54,<0.55",
  "typer>=0.27,<0.28",
  "structlog>=26.1,<27",
  "jinja2>=3.1,<4",
  "anthropic>=1.11,<2",
  "google-genai>=2.28,<3",
  "openai>=3.26,<4",
  "chromadb>=1.5,<2",
  "mcp>=2.3,<3",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "locust>=2.46,<3",
  "matplotlib>=3.11,<4",
  "psutil>=7.2,<8",
  "pytest>=9.1,<10",  # run-time: the sandboxed executor runs generated tests with it
  "ruff>=0.16,<0.17",  # run-time: static checks on generated tests
  "streamlit>=1.65,<2",  # VeroniQA UI
  "pypdf>=6.19,<7",  # text extraction for uploaded PDFs
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.9,<0.10"]

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pytest-cov>=7.1,<8",
  "types-pyyaml>=6.0,<7",
  "types-psutil>=7.2,<8",
]

[project.scripts]
agentqa = "agentqa.cli:app"
agentqa-mcp = "agentqa.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentqa", "target_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs", "evals/fixtures", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "SIM108", "RUF007", "SIM102",
  "S101"]  # asserts in shipped code only narrow types for mypy; none guard security

[tool.ruff.lint.per-file-ignores]
# Security rules (S) apply to shipped code. Tests assert, use fixture credentials and seeded RNGs.
"tests/**" = ["S105", "S106", "S311"]
"target_api/tests/**" = ["S105"]
# Developer scripts call git and docker with fixed arguments.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
packages = ["agentqa", "target_api", "examples"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "target_api/tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "slow: starts subprocess servers or runs load (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["agentqa"]
omit = ["agentqa/mcp/*", "agentqa/api/*", "agentqa/cli.py"]
