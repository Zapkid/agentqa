[project]
name = "veroniqa"
version = "0.1.0"
description = "Official command-line client for VeroniQA, the AI assistant for API testing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rowan Kendal" }]
keywords = ["veroniqa", "agentqa", "api-testing", "openapi", "cli", "ai-assistant"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []  # standard library only

[project.scripts]
veroniqa = "veroniqa_cli:main"

[project.urls]
Homepage = "https://veroniqa.vercel.app/"
Documentation = "https://veroniqa.vercel.app/developers"
Source = "https://github.com/Zapkid/agentqa/tree/main/clients/veroniqa-cli"
Issues = "https://github.com/Zapkid/agentqa/issues"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veroniqa_cli"]
